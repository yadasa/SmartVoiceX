<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">

  <title>SmartVoiceX Dashboard</title>
  <meta name="description" content="SmartVoiceX dashboard: deploy and manage your phone agents.">

  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32">
  <link rel="icon" type="image/png" href="/favicon-16.png" sizes="16x16">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">

  <link rel="stylesheet" href="/assets/svx-auth.css">
  <link rel="stylesheet" href="/assets/liquid-glass/svx-webgl-bg.css?v=20260402">

  <!-- Firebase (compat builds for static hosting) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="/assets/svx-auth.js" defer></script>
  <script src="/assets/liquid-glass/svx-webgl-bg.js?v=20260402c" defer></script>

  <style>
    body{margin:0;background:#000;color:#fff}

    /* Bring over homepage base + navbar styling so dashboard matches / */
    :root{
      --c-black: 0 0 0;
      --c-white: 255 255 255;
      --c-blue: 79 123 255;
      --c-purple: 98 20 217;

      --bg: rgb(var(--c-black) / 1);
      --bg2: rgb(var(--c-black) / 1);

      --panel: rgb(var(--c-white) / 0.06);
      --panel2: rgb(var(--c-white) / 0.08);
      --border: rgb(var(--c-white) / 0.12);

      --text: rgb(var(--c-white) / 0.92);
      --muted: rgb(var(--c-white) / 0.68);
      --muted2: rgb(var(--c-white) / 0.55);

      --svx-purple: rgb(var(--c-purple) / 1);
      --svx-blue: rgb(var(--c-blue) / 1);
      --c-blueText: 122 166 255;
      --svx-blueText: rgb(var(--c-blueText) / 1);
      --svx-white: rgb(var(--c-white) / 0.95);

      --accent: var(--svx-purple);
      --accent2: var(--svx-blue);

      --ring: rgb(var(--c-purple) / 0.35);
      --shadow: rgb(var(--c-black) / 0.40);
      --glass-1: rgb(var(--c-white) / 0.05);
      --glass-2: rgb(var(--c-white) / 0.10);
      --glass-3: rgb(var(--c-white) / 0.14);
      --ink-1: rgb(var(--c-black) / 0.10);
      --ink-2: rgb(var(--c-black) / 0.22);
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      background: var(--bg);
      color:var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      letter-spacing: -0.01em;
    }
    a{color:inherit;text-decoration:none}

    .container{max-width:1120px;margin:0 auto;padding:0 20px}
    .topbar .container{max-width:1200px}

    .topbar-bg{
      position:absolute;top:0;left:0;right:0;height:96px;
      /* On homepage this strip is visually transparent because WebGL bg sits behind.
         Keep it transparent on dashboard to match the look. */
      background: transparent;
      z-index:1;pointer-events:none;
    }
    .topbar{
      position:fixed;top:0;left:50%;transform:translateX(-50%);
      width:100%;z-index:20;padding:20px 0;
      pointer-events:none;background:transparent;
    }
    .nav{
      display:flex;align-items:center;justify-content:space-between;gap:18px;
      pointer-events:auto;
      background: rgb(var(--c-white) / 0.06);
      border: 1px solid rgb(var(--c-white) / 0.10);
      border-radius: 999px;
      padding: 12px 14px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 16px 40px rgb(var(--c-black) / 0.35);
    }
    .brand{display:flex;align-items:center;gap:10px;font-weight:700}
    .logo-img{display:block}
    .navlinks{display:flex;align-items:center;gap:14px;opacity:0.92}
    .navlinks a{padding:8px 10px;border-radius:999px;color:var(--muted)}
    .navlinks a[aria-current="page"], .navlinks a:hover{color:var(--text);background: rgb(var(--c-white) / 0.06)}
    .nav-actions{display:flex;align-items:center;gap:10px}
    .navutil{color:var(--muted);padding:8px 10px;border-radius:999px}
    .navutil:hover{color:var(--text);background: rgb(var(--c-white) / 0.06)}

    .btn{border:0;cursor:pointer;border-radius:999px;padding:10px 14px;font-weight:650}
    .btn.primary{color:#fff;background: linear-gradient(90deg, rgb(var(--c-purple)), rgb(var(--c-blue)))}
    .btn.secondary{color:var(--text);background: rgb(var(--c-white) / 0.08);border:1px solid rgb(var(--c-white) / 0.12)}
    .btn.ghost{color:var(--text);background:transparent;border:1px solid rgb(var(--c-white) / 0.12)}

    .navmenu-btn{display:none}

    /* Mobile menu (basic) */
    #svx-navmenu-backdrop{display:none;position:fixed;inset:0;background: rgb(var(--c-black) / 0.55);z-index:40}
    #svx-navmenu{display:none;position:fixed;inset:auto 12px 12px 12px;z-index:50}
    body.svx-navmenu-open #svx-navmenu-backdrop{display:block}
    body.svx-navmenu-open #svx-navmenu{display:block}
    #svx-navmenu .sheet{background: rgb(var(--c-white) / 0.06);border:1px solid rgb(var(--c-white) / 0.12);border-radius:18px;backdrop-filter: blur(12px);-webkit-backdrop-filter: blur(12px);padding:14px}
    #svx-navmenu .sheet-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
    #svx-navmenu .sheet-title{font-weight:700}
    #svx-navmenu .sheet-close{border:1px solid rgb(var(--c-white) / 0.12);background:transparent;color:var(--text);border-radius:12px;padding:8px 10px;cursor:pointer}
    #svx-navmenu .sheet-links{display:flex;flex-direction:column;gap:8px;margin:10px 0}
    #svx-navmenu .sheet-links a{padding:10px 12px;border-radius:12px;background: rgb(var(--c-white) / 0.05);border:1px solid rgb(var(--c-white) / 0.10)}
    #svx-navmenu .sheet-actions{display:flex;gap:10px;flex-wrap:wrap}

    @media (max-width: 920px){
      .navlinks{display:none}
      .navmenu-btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid rgb(var(--c-white) / 0.12);background: rgb(var(--c-white) / 0.06);color:var(--text);border-radius:999px;padding:10px 14px;cursor:pointer}
    }

    /* Ensure page content isn't hidden under fixed navbar */
    body{padding-top: 110px;}

    /* Turn the signed-in "modal" into a normal page surface */
    #svx-auth-backdrop{display:none !important;}
    #svx-signedin-modal{position:static !important; inset:auto !important; display:block !important;}
    #svx-signedin-modal.open{display:block !important;}
    #svx-signedin-modal .svx-close{display:none !important;}
    #svx-signedin-modal .svx-modal{max-width: 1100px; margin: 24px auto; max-height:none !important; overflow:visible !important;}
    /* Ensure only the page scrolls */
    html, body{overflow-y:auto}
  </style>
</head>

<body>
  <noscript>You need JavaScript enabled to use the SmartVoiceX dashboard.</noscript>

  <div class="topbar-bg" aria-hidden="true"></div>

  <div class="topbar">
    <div class="container">
      <div class="nav">
        <a class="brand" href="/">
          <img class="logo-img" src="/assets/brand/logo-90.png" alt="SmartVoiceX" width="45" height="40" />
          <span>SmartVoiceX</span>
        </a>

        <div class="navlinks" aria-label="Primary">
          <a href="/">Home</a>
          <a href="/#pricing">Pricing</a>
          <a href="/#faq">FAQ</a>
          <a href="/dashboard.html" aria-current="page">Dashboard</a>
        </div>

        <div class="nav-actions">
          <a class="navutil" id="svx-nav-auth" href="#" onclick="window.SVXAuth?.openSignIn?.(); return false;">Sign in</a>
          <button class="btn primary" type="button" onclick="window.SVXOpenWidget?.()">Talk to the AI live</button>
          <button class="navmenu-btn" id="svx-navmenu-open" type="button" aria-label="Open menu">Menu</button>
        </div>
      </div>
    </div>
  </div>

  <div id="svx-navmenu-backdrop" aria-hidden="true"></div>
  <div id="svx-navmenu" role="dialog" aria-modal="true" aria-label="Menu">
    <div class="sheet">
      <div class="sheet-header">
        <div class="sheet-title">Menu</div>
        <button class="sheet-close" id="svx-navmenu-close" type="button">Close</button>
      </div>

      <nav class="sheet-links" aria-label="Sections">
        <a href="/" data-svx-navlink>Home</a>
        <a href="/#pricing" data-svx-navlink>Pricing</a>
        <a href="/#faq" data-svx-navlink>FAQ</a>
        <a href="/dashboard.html" data-svx-navlink>Dashboard</a>
      </nav>

      <div class="sheet-actions" aria-label="Actions">
        <button class="btn primary" type="button" onclick="window.SVXOpenWidget?.()">Talk to the AI live</button>
        <button class="btn ghost" type="button" onclick="location.href='/dashboard.html'">Dashboard</button>
      </div>
    </div>
  </div>

  <script>
    // Mobile nav menu behavior (same as homepage)
    (function(){
      const openBtn = document.getElementById('svx-navmenu-open');
      const closeBtn = document.getElementById('svx-navmenu-close');
      const backdrop = document.getElementById('svx-navmenu-backdrop');
      const sheet = document.getElementById('svx-navmenu');
      if(!openBtn || !closeBtn || !backdrop || !sheet) return;

      function open(){
        document.body.classList.add('svx-navmenu-open');
        try{ sheet.querySelector('a,button')?.focus({ preventScroll:true }); }catch(_){ }
      }
      function close(){
        document.body.classList.remove('svx-navmenu-open');
        try{ openBtn.focus({ preventScroll:true }); }catch(_){ }
      }
      openBtn.addEventListener('click', open);
      closeBtn.addEventListener('click', close);
      backdrop.addEventListener('click', close);
      sheet.querySelectorAll('[data-svx-navlink]').forEach((a) => a.addEventListener('click', close));
      document.addEventListener('keydown', (e) => {
        if(e.key === 'Escape' && document.body.classList.contains('svx-navmenu-open')) close();
      });
    })();

    // Once the auth script loads, open dashboard UI if authed, otherwise show sign-in.
    window.addEventListener('load', () => {
      try {
        // Wait for Firebase auth to hydrate, then open dashboard or sign-in.
        window.SVXAuth?.openDashboard?.();
      } catch (_) {}
    });
  </script>

  <!-- SmartVoiceX Widget (from Dentai staging) -->
  <script src="https://staging.smartvoicex.com/svx-widget.js"></script>
  <smartvoicex-widget agent-id="agent_7401kn7jxcf7f1c8ecmd087n9c52" mode="voice"></smartvoicex-widget>
  <script>
    window.SVXOpenWidget = function(){
      try {
        const w = document.querySelector('smartvoicex-widget');
        if (!w) return;
        w.setAttribute('open', '');
        w.setAttribute('mode', 'voice');
        if (typeof w.open === 'function') w.open();
      } catch (_) {}
    };
  </script>
</body>
</html>
